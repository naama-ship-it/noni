<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a0e">
<link rel="icon" href="/icons/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="רשימת קניות · Noni">
<meta property="og:description" content="רשימה משותפת — מסמנים מה נקנה, ישר מהקישור.">
<meta property="og:image" content="__PUBLIC_URL__/og.png">
<title>רשימה משותפת · Noni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* נוני — רשימה משותפת בקישור (גרסה 2026-11-02-05) · © כל הזכויות שמורות לנעמה אורפלי */
:root{--mod:#ff2d9a;--ink:#f3f1f6;--muted:#a9a3b4;--line:#2d2834;--bg:#0b0a0e;--card:#17151c;--green:#3ddc84;--grad:linear-gradient(135deg,#ff2d9a,#b4188f);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header svg{width:30px;height:30px}
.brand{font-weight:800;font-size:22px;color:#fff;unicode-bidi:isolate;display:inline-block}.brand span{color:var(--mod)}
header .t{margin-inline-start:auto;color:var(--muted);font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 0 0 1px rgba(255,45,154,.08),0 12px 30px rgba(0,0,0,.35)}
h1{font-size:20px;margin:0 0 2px;color:#fff}
.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:17px}
.item:first-child{border-top:0}
.item input{width:24px;height:24px;accent-color:var(--mod);flex:none}
.item .tx{flex:1}.item.done .tx{text-decoration:line-through;color:var(--muted)}
.item .qty{color:var(--muted);font-size:13px}
.item .rm{border:1px solid var(--line);background:none;color:var(--muted);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1}
.row{display:flex;gap:8px;margin-top:12px}
input[type=text]{flex:1;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;font-size:16px}
.btn{border:0;background:var(--grad);color:#fff;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
.muted{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 8px;line-height:1.7}
.foot a{color:var(--mod);text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#0b0a0e;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="nm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d9a"/><stop offset="1" stop-color="#b4188f"/></linearGradient></defs><path d="M60 10c28 0 50 20 50 46 0 26-22 46-50 46-6 0-12-1-17-3L18 108l5-22C14 78 10 67 10 56 10 30 32 10 60 10z" fill="url(#nm)"/><path d="M40 76V44l40 32V44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="brand" dir="ltr">N<span>o</span>ni</span>
  <span class="t">רשימה משותפת</span>
</header>
<div class="wrap">
  <div class="card">
    <h1 id="title">רשימת קניות</h1>
    <div class="sub" id="sub">טוען…</div>
    <div id="items"></div>
    <div class="row"><input type="text" id="newText" placeholder="להוסיף פריט…"><button class="btn" id="add">הוספה</button></div>
    <div class="row"><button class="btn ghost" id="clear">למחוק את מה שנקנה</button></div>
  </div>
  <p class="foot">הרשימה מתעדכנת אצל כל מי שיש לו את הקישור.<br><a href="/">נוני — העוזרת האישית</a> · © כל הזכויות שמורות לנעמה אורפלי</p>
</div>
<div class="toast" id="toast"></div>
<script>
const tok = location.pathname.split("/")[2] || "";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let D = null, toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2200); }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ ok: false, error: "שגיאה " + r.status }));
  if (!j.ok) throw new Error(j.error || "שגיאה");
  return j;
}
function render() {
  const open = D.items.filter(i => !i.done).length;
  document.title = `${D.list} · Noni`;
  $("#title").textContent = D.list;
  $("#sub").textContent = `${D.household ? D.household + " · " : ""}${open ? open + " פריטים לקנות" : "הכול נקנה"}${D.items.length - open ? " · " + (D.items.length - open) + " סומנו" : ""}`;
  $("#items").innerHTML = D.items.length ? D.items.map(i => `<div class="item ${i.done ? "done" : ""}" data-id="${i.id}"><input type="checkbox" ${i.done ? "checked" : ""} aria-label="נקנה"><span class="tx">${esc(i.text)}${i.qty ? ` <span class="qty">×${esc(i.qty)}</span>` : ""}</span><button class="rm" title="מחיקה" aria-label="מחיקה">×</button></div>`).join("") : `<p class="muted">הרשימה ריקה.</p>`;
}
async function load() { try { D = await api("GET", "/api/l/" + tok); render(); } catch (e) { $("#sub").textContent = e.message; $("#items").innerHTML = ""; } }
$("#items").addEventListener("change", async e => { const row = e.target.closest(".item"); if (!row) return; try { D = await api("POST", `/api/l/${tok}/check`, { id: Number(row.dataset.id), done: e.target.checked }); render(); } catch (err) { toast(err.message); } });
$("#items").addEventListener("click", async e => { const b = e.target.closest(".rm"); if (!b) return; const row = b.closest(".item"); try { D = await api("POST", `/api/l/${tok}/remove`, { id: Number(row.dataset.id) }); render(); toast("נמחק"); } catch (err) { toast(err.message); } });
$("#add").onclick = async () => { const t = $("#newText").value.trim(); if (!t) return; try { D = await api("POST", `/api/l/${tok}/add`, { text: t }); $("#newText").value = ""; render(); } catch (err) { toast(err.message); } };
$("#newText").addEventListener("keydown", e => { if (e.key === "Enter") $("#add").click(); });
$("#clear").onclick = async () => { if (!D) return; const done = D.items.filter(i => i.done); if (!done.length) return toast("אין פריטים מסומנים"); for (const i of done) { try { D = await api("POST", `/api/l/${tok}/remove`, { id: i.id }); } catch (e) {} } render(); toast("נמחקו " + done.length); };
load(); setInterval(load, 10000);
</script>
</body>
</html>
